<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Money Lego: describe how money should move, approve it, run it on PayPal">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#d4d4d8"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fafafa" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#fafafa" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fafafa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="#fafafa"/>
  <rect width="1200" height="320" rx="28" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="28" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="27.5" fill="none" stroke="#ececee"/>

  <!-- The mark -->
  <g transform="translate(72 88) scale(4.5)">
    <rect width="32" height="32" rx="9" fill="#09090b"/>
    <path d="M12 7.5H24A2 2 0 0 1 26 9.5V13.5A2 2 0 0 1 24 15.5H19.977A4.25 4.25 0 0 0 12.023 15.5H12A2 2 0 0 1 10 13.5V9.5A2 2 0 0 1 12 7.5Z" fill="#fff"/>
    <path d="M8 17H13.25A2.75 2.75 0 0 1 18.75 17H20A2 2 0 0 1 22 19V23A2 2 0 0 1 20 25H8A2 2 0 0 1 6 23V19A2 2 0 0 1 8 17Z" fill="#4f6bff"/>
  </g>

  <text x="250" y="150" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2" fill="#09090b">Money Lego</text>
  <text x="252" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="26" fill="#52525b">Describe how money should move. Approve it. Run it on PayPal.</text>

  <!-- A workflow in blocks, the product's own visual language -->
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600">
    <g transform="translate(252 236)">
      <rect width="132" height="40" rx="10" fill="#fff" stroke="#ececee"/><rect width="4" height="40" rx="2" fill="#e3a21a"/>
      <text x="18" y="25" fill="#09090b">Buyer pays</text>
    </g>
    <path d="M384 256h20" stroke="#d4d4d8" stroke-width="2"/>
    <g transform="translate(404 236)">
      <rect width="104" height="40" rx="10" fill="#fff" stroke="#ececee"/><rect width="4" height="40" rx="2" fill="#3c8dbc"/>
      <text x="18" y="25" fill="#09090b">Split 70/30</text>
    </g>
    <path d="M508 256h20" stroke="#d4d4d8" stroke-width="2"/>
    <g transform="translate(528 236)">
      <rect width="118" height="40" rx="10" fill="#fff" stroke="#ececee"/><rect width="4" height="40" rx="2" fill="#2c4bd6"/>
      <text x="18" y="25" fill="#09090b">AI risk check</text>
    </g>
    <path d="M646 256h20" stroke="#d4d4d8" stroke-width="2"/>
    <g transform="translate(666 236)">
      <rect width="118" height="40" rx="10" fill="#fff" stroke="#ececee"/><rect width="4" height="40" rx="2" fill="#7a3e8f"/>
      <text x="18" y="25" fill="#09090b">You approve</text>
    </g>
    <path d="M784 256h20" stroke="#d4d4d8" stroke-width="2"/>
    <g transform="translate(804 236)">
      <rect width="132" height="40" rx="10" fill="#fff" stroke="#ececee"/><rect width="4" height="40" rx="2" fill="#003087"/>
      <text x="18" y="25" fill="#09090b">PayPal payout</text>
    </g>
    <path d="M936 256h20" stroke="#d4d4d8" stroke-width="2"/>
    <g transform="translate(956 236)">
      <rect width="116" height="40" rx="10" fill="#fff" stroke="#ececee"/><rect width="4" height="40" rx="2" fill="#c2412d"/>
      <text x="18" y="25" fill="#09090b">Slack: paid</text>
    </g>
  </g>
</svg>
